<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Ads Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 900: '#0f1419', 800: '#1a2332', 700: '#243044' },
            accent: { DEFAULT: '#3b82f6', hover: '#2563eb' },
          },
        },
      },
    };
  </script>
</head>
<body class="h-full bg-surface-900 text-gray-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-surface-800 border border-surface-700 rounded-2xl shadow-2xl p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-accent/20 text-accent mb-4 mx-auto">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">Google Ads Monitor</h1>
        <p class="text-gray-400 text-sm mt-1">Đăng nhập quản trị</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
          <input type="text" id="username" value="Black7777" readonly
            class="w-full px-4 py-2.5 rounded-lg bg-surface-900 border border-surface-700 text-gray-400 cursor-not-allowed" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full px-4 py-2.5 rounded-lg bg-surface-900 border border-surface-700 focus:border-accent focus:ring-1 focus:ring-accent outline-none transition" />
        </div>
        <p id="error" class="text-red-400 text-sm hidden"></p>
        <button type="submit"
          class="w-full py-2.5 rounded-lg bg-accent hover:bg-accent-hover font-semibold transition">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (res.ok) location.href = '/dashboard';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        location.href = '/dashboard';
        return;
      }
      const data = await res.json().catch(() => ({}));
      errEl.textContent = data.error || 'Đăng nhập thất bại';
      errEl.classList.remove('hidden');
    });
  </script>
</body>
</html>
